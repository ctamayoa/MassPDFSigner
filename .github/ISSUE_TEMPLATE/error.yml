name: Reportar un error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **No adjuntes certificados (.p12/.pfx), contraseñas ni PDFs reales.** Si necesitas un ejemplo, usa un PDF inventado.
  - type: input
    id: version
    attributes:
      label: Versión del programa
      description: La ves en el informe de cada corrida (resumen_firmado_*.txt) o en la Release que descargaste.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operativo
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué ocurrió en realidad. Copia el mensaje que viste en pantalla.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: opciones
    attributes:
      label: Opciones marcadas
      description: Una o dos firmas, subcarpetas, evitar tapar contenido, QR, sello de tiempo, etc.
