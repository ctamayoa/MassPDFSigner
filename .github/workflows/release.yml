name: Release

# Se dispara al subir una etiqueta vX.Y.Z (por ejemplo v1.0.0)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: La etiqueta debe coincidir con la versión del código
        shell: pwsh
        run: |
          $version = python -c "import firmador_masivo; print(firmador_masivo.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "La etiqueta ${{ github.ref_name }} no coincide con la versión del código (v$version)."
            exit 1
          }

      - name: Pruebas
        run: python -m pytest

      - name: Compilar el .exe
        run: >
          pyinstaller --onefile --windowed --name FirmadorPDF --paths src
          --collect-all pyhanko --collect-all pyhanko_certvalidator
          --collect-all pymupdf --collect-all aiohttp --collect-all qrcode --collect-data firmador_masivo
          packaging/firmador_pdf.py

      - name: Calcular SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FirmadorPDF.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FirmadorPDF.exe" | Out-File -Encoding ascii dist/FirmadorPDF.exe.sha256
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Notas de la versión desde el CHANGELOG
        shell: pwsh
        run: python packaging/notas_version.py "${{ github.ref_name }}" "$env:SHA256" > notas.md

      - name: Publicar la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/FirmadorPDF.exe dist/FirmadorPDF.exe.sha256
          --title "${{ github.ref_name }}" --notes-file notas.md
